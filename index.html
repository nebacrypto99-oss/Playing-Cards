<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">

    <div class="card ace">
          <p class="card-icon ace-a">A</p>
          <span class="card-icon top-left">♠</span>
          <span class="card-icon middle">♠</span>
          <span class="card-icon bottom">♠</span>
          <p class="card-icon ace-a-reversed">A</p>
    </div>

    <div class="card flower">
      <p class="card-icon ace-a">2</p>
      <span class="card-icon top-left">♣</span>
      <span class="flower-middle">♣</span>
      <span class="flower-middle reversed">♣</span>
      <span class="flower-bottom">♣</span>
      <p class="flower-2-reversed">2</p>
    </div>

    <div class="card heart">
      <p class="card-icon top-3">3</p>
      <span class="card-icon top-left-heart">♥</span>
      <span class="middle-1">♥</span>
      <span class="middle-2">♥</span>
      <span class="heart-reversed">♥</span>
      <span class="bottom">♥</span>
      <p class="heart-3-reversed">3</p>
    </div>

    <div class="card-club card">
      <p class="card-icon club-4">4</p>
      <span class="club-top">♣</span>
        <span class="club-middle-2">♣ ♣</span>
        <span class="club-middle-2-reversed">♣ ♣</span>
        <span class="club-bottom">♣</span>
        <p class="club-4-reversed">4</p>
    </div>


    <div class="card diamond">
      <p class="card-icon diamond-5">5</p>
      <span class="diamond-top">♦</span>
      <span class="diamond-middle-2">♦ ♦</span>
      <span class="diamond-middle-1"> ♦ </span>
      <span class="diamond-middle-2-reversed">♦ ♦</span>
      <span class="diamond-bottom">♦</span>
      <p class="diamond-5-reversed">5</p>


    </div>



  </div>






</body>
</html>
